name: Solo Lecture 4 - Task Manager CI
on:
  push:
    branches: [main, 'solo-practicals-*']
    paths:
      - 'solo-practicals/lecture4/**'
      - '.github/workflows/solo-lecture4.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: solo-practicals-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test-and-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t solo-tasks:latest solo-practicals/lecture4
      - name: Run tests and HTML updater
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -e GITHUB_WORKSPACE=/workspace solo-tasks:latest
      - name: Commit generated HTML only for pushes
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solo-practicals/lecture4/index.html
          if ! git diff --cached --quiet; then
            git commit -m "L4: automated task report"
            git push origin HEAD:${{ github.ref_name }}
          fi
